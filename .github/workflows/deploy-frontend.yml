name: Build and deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: yorimichi-prod-frontend-108875909398
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build-and-deploy:
    name: Build and deploy React application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check CloudFront distribution ID
        shell: bash
        run: |
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Set the CLOUDFRONT_DISTRIBUTION_ID repository variable in GitHub Actions."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build React application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::108875909398:role/yorimichi-prod-github-frontend-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: yorimichi-frontend-deploy
          allowed-account-ids: "108875909398"

      - name: Upload frontend files to S3
        run: |
          aws s3 sync ./dist "s3://$S3_BUCKET" \
            --delete \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
